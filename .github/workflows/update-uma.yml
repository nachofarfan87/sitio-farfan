name: Actualizar UMA

on:
  schedule:
    - cron: '0 12 * * *'   # todos los días ~09:00 (hora Argentina, UTC-3)
  workflow_dispatch:        # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: actualizar-uma
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Leer el valor del UMA y actualizar honorarios/uma.json
        run: python3 scripts/update_uma.py

      - name: Publicar si cambió
        run: |
          if [ -n "$(git status --porcelain honorarios/uma.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add honorarios/uma.json
            git commit -m "Actualizar UMA (automático)"
            git push
            echo "uma.json actualizado; Netlify republica solo."
          else
            echo "Sin cambios en uma.json."
          fi
