name: Actualizar UMA

# La corrida diaria está apagada desde el 19-ago-2026. El sitio se migró a
# Astro en el repo nachofarfan87/estudiofarfan, que tiene su propia copia de
# este workflow apuntando a public/honorarios/uma.json. Además los despliegues
# de Netlify de ESTE sitio están pausados, así que actualizar uma.json acá no
# cambiaba nada publicado: sólo acumulaba commits.
#
# Para reactivarla —si el sitio viejo vuelve a publicar antes que el nuevo—
# alcanza con descomentar las dos líneas de `schedule`.
on:
  # schedule:
  #   - cron: '0 12 * * *'   # todos los días ~09:00 (hora Argentina, UTC-3)
  workflow_dispatch:        # queda el disparo manual desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: actualizar-uma
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Leer el valor del UMA y actualizar honorarios/uma.json
        run: python3 .github/scripts/update_uma.py

      - name: Publicar si cambió
        run: |
          if [ -n "$(git status --porcelain honorarios/uma.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add honorarios/uma.json
            git commit -m "Actualizar UMA (automático)"
            git push
            echo "uma.json actualizado; Netlify republica solo."
          else
            echo "Sin cambios en uma.json."
          fi
