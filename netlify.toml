# Sitio estático sin compilación: Netlify publica la raíz del repo tal cual.
# Sin build command a propósito; no hay nada que compilar.
[build]
  publish = "."

# Cabeceras: el HTML nunca se cachea (para que un deploy se vea al instante),
# los datos del arancel poco, y las imágenes mucho.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/honorarios/*.json"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/honorarios/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Sin esto Netlify lo sirve como application/octet-stream y el manifiesto
# queda en zona gris para instalar la página en el teléfono.
[[headers]]
  for = "/honorarios/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/honorarios/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# La hoja de las páginas de materia no cambia seguido: que se cachee.
[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"
